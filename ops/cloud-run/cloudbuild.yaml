steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["NPMRC"]
    args: ["build", "--pull", "--secret", "id=npmrc,env=NPMRC", "--tag", "${_IMAGE_URI}", "."]
images: ["${_IMAGE_URI}"]
options:
  machineType: E2_HIGHCPU_8
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/npm-install-configuration/versions/latest
      env: NPMRC
